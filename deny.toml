# cargo-deny: the binary stays under permissive licenses, and only crates.io
# supplies code.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [{ id = "RUSTSEC-2026-0192", reason = "ttf-parser comes in through cosmic-text's fontdb 0.23; drop this once cosmic-text moves to fontdb 0.24" }]

[licenses]
version = 2
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9
# the list covers dependencies to come, not only today's
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
