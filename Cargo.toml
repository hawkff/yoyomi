[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/hawkff/yoyomi"
publish = false

[workspace.dependencies]
yoyomi-core = { path = "crates/core", version = "0.0.1" }
yoyomi-formats = { path = "crates/formats", version = "0.0.1" }
yoyomi-render = { path = "crates/render", version = "0.0.1" }
yoyomi-state = { path = "crates/state", version = "0.0.1" }
yoyomi-view = { path = "crates/view", version = "0.0.1" }
yoyomi-text = { path = "crates/text", version = "0.0.1" }
yoyomi-search = { path = "crates/search", version = "0.0.1" }
yoyomi-web = { path = "crates/web", version = "0.0.1" }
yoyomi-native = { path = "crates/native", version = "0.0.1" }

base64 = "0.23.1"
cosmic-text = { version = "0.19.0", default-features = false, features = ["std", "swash"] }
crossbeam-channel = "0.5.17"
crossterm = "0.29.0"
dispatch2 = { version = "0.3.1", default-features = false, features = ["std"] }
encoding_rs = "0.8.35"
fast_image_resize = "6.1.0"
fontdb = { version = "0.23.0", default-features = false, features = ["std"] }
image = { version = "0.25.10", default-features = false, features = ["bmp", "gif", "jpeg", "png", "pnm", "webp"] }
libc = "0.2.191"
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "std",
    "NSApplication",
    "NSColor",
    "NSEvent",
    "NSGraphics",
    "NSGraphicsContext",
    "NSResponder",
    "NSRunningApplication",
    "NSView",
    "NSWindow",
    "NSWorkspace",
    "objc2-core-foundation",
    "objc2-core-graphics",
] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFCGTypes", "CFData"] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["std", "CGColorSpace", "CGContext", "CGDataProvider", "CGImage"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSGeometry", "NSString", "NSURL", "objc2-core-foundation"] }
# crossterm uses 0.12, so one version serves the whole build
parking_lot = "0.12.5"
png = "0.18.1"
quick-xml = { version = "0.42.0", features = ["escape-html"] }
ratatui = "0.30.2"
rars = { version = "0.12.4", default-features = false }
roxmltree = "0.21.2"
rustix = { version = "1.1.6", features = ["event", "fs", "process", "stdio", "termios"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
thiserror = "2.0.21"
unicode-normalization = "0.1.24"
unicode-segmentation = "1.13.3"
unicode-width = "0.2.3"
zip = { version = "9.5.1", default-features = false, features = ["deflate", "deflate64"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
